name: Equity Tracker

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"

  workflow_dispatch:

jobs:
  track-equity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install alpaca-py pandas

      - name: Run tracker
        env:
          ALPACA_API_KEY: ${{ secrets.LIVE_ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.LIVE_ALPACA_SECRET_KEY }}
        run: python tracker.py

      - name: Commit updated history
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add equity_history.csv
          git commit -m "update equity history" || echo "No changes"
          git push
